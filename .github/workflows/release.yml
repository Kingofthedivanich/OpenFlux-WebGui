name: Release

# Builds the linux/amd64 exit-node binary and attaches it to the GitHub
# Release for the pushed tag, with the version baked in via -ldflags so
# `openflux --version` (and deploy/update.sh, which checks that output)
# can confirm an update actually took effect.
on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-and-attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -trimpath -o openflux-linux-amd64 .

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Uploads to the release for this tag if one already exists
          # (created manually, as with the fork's release notes so far);
          # creates a minimal one otherwise so the asset always has a home.
          if ! gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" \
              --title "${{ github.ref_name }}" --notes "Automated build."
          fi
          gh release upload "${{ github.ref_name }}" openflux-linux-amd64 \
            --repo "${{ github.repository }}" --clobber
