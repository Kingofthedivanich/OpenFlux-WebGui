<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OpenFlux — панель управления</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>

<div id="login-view" class="view">
  <form id="login-form" class="login-card">
    <h1>OpenFlux</h1>
    <p class="subtitle">Панель управления exit-node</p>
    <label>Логин
      <input type="text" id="login-user" autocomplete="username" required />
    </label>
    <label>Пароль
      <input type="password" id="login-pass" autocomplete="current-password" required />
    </label>
    <div id="login-error" class="error-text"></div>
    <button type="submit" class="primary">Войти</button>
  </form>
</div>

<div id="dashboard-view" class="view" style="display:none">
  <header>
    <h1>OpenFlux</h1>
    <div class="header-actions">
      <button id="add-client-btn" class="primary">+ Добавить клиента</button>
      <button id="logout-btn" class="ghost">Выйти</button>
    </div>
  </header>

  <main>
    <div id="clients-empty" class="empty-state" style="display:none">
      Нет ни одного клиента. Добавь первого.
    </div>
    <div id="clients-list"></div>
  </main>
</div>

<div id="add-modal" class="modal-overlay" style="display:none">
  <form id="add-form" class="modal-card">
    <h2>Новый клиент</h2>

    <label>Имя
      <input type="text" id="f-name" required />
    </label>

    <label>Транспорт
      <select id="f-transport">
        <option value="yandex">Yandex.Docs</option>
        <option value="vyandex">Yandex.Docs (Volga)</option>
        <option value="oneme">MAX Messenger</option>
        <option value="cupsonline">Cups.online</option>
        <option value="mailru">Mail.ru Docs</option>
      </select>
    </label>

    <div id="f-url-group" class="field-group">
      <label>URL документа
        <input type="text" id="f-url" placeholder="https://disk.yandex.com/i/..." />
      </label>
    </div>

    <div id="f-max-group" class="field-group" style="display:none">
      <label>MAX Access Token
        <input type="text" id="f-max-token" />
      </label>
      <label>MAX User ID
        <input type="text" id="f-max-uid" />
      </label>
    </div>

    <label>Кодек
      <select id="f-codec">
        <option value="">batched (по умолчанию)</option>
        <option value="legacy">legacy (старые exit-узлы)</option>
      </select>
    </label>

    <label>Файл общего секрета PSK (необязательно, закрывает клиента от посторонних)
      <input type="text" id="f-psk-file" placeholder="/path/to/secret.txt" />
    </label>

    <div id="add-error" class="error-text"></div>

    <div class="modal-actions">
      <button type="button" id="add-cancel-btn" class="ghost">Отмена</button>
      <button type="submit" class="primary">Добавить</button>
    </div>
  </form>
</div>

<script src="/app.js"></script>
</body>
</html>
